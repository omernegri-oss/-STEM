# Desktop builds: plain folders (no installer), zipped by the CI workflow for download.
appId: com.supermarket.game
productName: Supermarket
copyright: Copyright © 2026 Supermarket
directories:
  output: release
  buildResources: build
files:
  - package.json
  - desktop/**
  - server/**
  - shared/**
  - client/**
  - "!**/*.map"
  - node_modules/ws/**
  - node_modules/peerjs/dist/peerjs.min.js
  - vendor/three/**
  - "!node_modules/three/**"
  - "!node_modules/electron*/**"
npmRebuild: false
win:
  target: [dir]
  icon: build/icon.png
  signAndEditExecutable: false
mac:
  target: [dir]
  icon: build/icon.png
  category: public.app-category.simulation-games
  identity: null
linux:
  target: [dir]
  icon: build/icon.png
  category: Game
  executableName: supermarket
