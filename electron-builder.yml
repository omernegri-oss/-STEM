# Desktop builds: plain folders (zipped by the CI workflow) and, for Windows, a one-click installer.
appId: com.supermarket.game
productName: Supermarket
copyright: Copyright © 2026 Supermarket
directories:
  output: release
  buildResources: build
files:
  - package.json
  - desktop/**
  - server/**
  - shared/**
  - client/**
  - "!**/*.map"
  - node_modules/ws/**
  - node_modules/peerjs/dist/peerjs.min.js
  - vendor/three/**
  - "!node_modules/three/**"
  - "!node_modules/electron*/**"
npmRebuild: false
# the CI workflow publishes the downloads itself (release job); electron-builder must not try to
publish: null
win:
  target: [dir, nsis]
  icon: build/icon.png
  signAndEditExecutable: false
# one click: installs for this user only (no admin rights), adds desktop + Start menu shortcuts, then starts the game
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Supermarket
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: Supermarket-windows-setup.exe
mac:
  target: [dir]
  icon: build/icon.png
  category: public.app-category.simulation-games
  identity: null
linux:
  target: [dir]
  icon: build/icon.png
  category: Game
  executableName: supermarket
