# Builds the Steam (desktop) version for Windows, macOS and Linux, and can upload it to Steam.
# Run it from GitHub: Actions > "Desktop builds (Steam)" > Run workflow.
# Downloads: the Releases page (latest build), or each run's page under "Artifacts".
name: Desktop builds (Steam)

on:
  workflow_dispatch:
    inputs:
      upload_to_steam:
        description: Upload this build to Steam (needs the STEAM_* secrets, see STEAM.md)
        type: boolean
        default: false
      steam_branch:
        description: Steam branch to set the build live on (empty = upload only)
        type: string
        default: ''
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, script: 'dist:win', out: release/win-unpacked }
          # macOS runners are often unavailable for this repo: build the Intel app on Linux (runs on Apple Silicon via Rosetta)
          - { os: ubuntu-latest, name: mac, script: 'dist:mac-intel', out: release/mac }
          - { os: ubuntu-latest, name: linux, script: 'dist:linux', out: release/linux-unpacked }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # on Windows the exe gets its icon; elsewhere the default config is used
      - if: matrix.name == 'windows'
        shell: bash  # PowerShell would split the -c.win... argument
        run: npm run ${{ matrix.script }} -- -c.win.signAndEditExecutable=true
      - if: matrix.name != 'windows'
        run: npm run ${{ matrix.script }}
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      # the Linux build starts and plays the opening in a virtual display
      - if: matrix.name == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          npx playwright@1.56.1 install-deps chromium >/dev/null || true
          npm i --no-save playwright@1.56.1
          ELECTRON_PATH=$PWD/release/linux-unpacked/supermarket SHOTS=shots xvfb-run -a node tests/desktop-smoke.mjs
      # GitHub artifacts drop file permissions and symlinks, which breaks the Mac app and the Linux executable:
      # pack them in archives that keep both (zip for macOS, tar.gz for Linux). Windows is uploaded as a folder.
      - if: matrix.name == 'mac'
        run: cd release/mac && zip -qry ../../Supermarket-mac.zip Supermarket.app
      - if: matrix.name == 'linux'
        run: tar -C release/linux-unpacked -czf Supermarket-linux.tar.gz .
      - if: matrix.name == 'windows'
        shell: bash
        run: cd release/win-unpacked && 7z a -tzip -bso0 ../../Supermarket-windows.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Supermarket-${{ matrix.name }}
          path: ${{ matrix.name == 'mac' && 'Supermarket-mac.zip' || matrix.name == 'linux' && 'Supermarket-linux.tar.gz' || 'Supermarket-windows.zip' }}
          if-no-files-found: error

  # Publishes the three downloads on the repository's Releases page. Fixed addresses for the newest version:
  #   https://github.com/<owner>/<repo>/releases/latest/download/Supermarket-windows.zip   (and -mac.zip, -linux.tar.gz)
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: builds, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Supermarket build ${{ github.run_number }}
          make_latest: true
          body: |
            Download the version for your computer:
            - **Windows**: Supermarket-windows.zip. Extract it and run Supermarket.exe (Windows may warn about an unknown app: More info, Run anyway).
            - **Mac**: Supermarket-mac.zip. Open it, right-click Supermarket.app and choose Open the first time (Intel app, runs on Apple Silicon with Rosetta).
            - **Linux / Steam Deck**: Supermarket-linux.tar.gz. Extract it and run ./supermarket.
            Play with friends through Steam invites (Steam must be running), or solo without Steam.
          files: |
            builds/Supermarket-windows.zip
            builds/Supermarket-mac.zip
            builds/Supermarket-linux.tar.gz

  steam:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_steam }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: builds }
      - name: Unpack the macOS and Linux archives
        run: |
          cd builds
          mkdir mac linux windows
          unzip -q Supermarket-windows/Supermarket-windows.zip -d windows
          unzip -q Supermarket-mac/Supermarket-mac.zip -d mac
          tar -xzf Supermarket-linux/Supermarket-linux.tar.gz -C linux
      - uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ secrets.STEAM_APP_ID }}
          buildDescription: ${{ github.sha }}
          rootPath: builds
          depot1Path: windows
          depot2Path: mac
          depot3Path: linux
          releaseBranch: ${{ inputs.steam_branch }}
